# The site's Content-Security-Policy — generated by app/render/csp.ts; do not edit.
#
# The same line, byte for byte, in the live site's response header, this tree, and the
# CMS bundle's snippets/skunk-csp.conf (SDS §10.5, C-12). Include it in the server block
# that serves these pages:
#
#     include /etc/nginx/snippets/skunk-csp.conf;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https:; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
