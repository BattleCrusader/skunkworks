# 00-default.conf — 404 from a location, never from server scope (SDS §5.2, §12.3).
# A `return 404` in server scope was measured to swallow the health location and
# make the edge report itself unhealthy.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # S4d: a TLS listener without a certificate is `nginx: [emerg] no "ssl_certificate" is
    # defined` — and the config has always emitted `listen 443 ssl` for the admin and demos
    # hosts. `install.sh` writes this self-signed pair when `certs/default.crt` is absent, so
    # nginx can start before ACME has issued anything (a host whose certificate is pending
    # still answers on 80, §12.5). A tenant whose `cert_state = 'issued'` gets its own
    # `certs/<host>.crt` in its block instead.
    ssl_certificate     /etc/nginx/certs/default.crt;
    ssl_certificate_key /etc/nginx/certs/default.key;

    location / {
        return 404;
    }
}
