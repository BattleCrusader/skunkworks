<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="presentation" focusable="false">
  <!--
    An abstract line diagram of the work the firm actually does: three systems on the left, one
    gateway in the middle, one interface on the right. It is drawn, not photographed, and it says
    the same thing the proof section says in words.
  -->
  <g fill="none" stroke="#0B1F33" stroke-width="1" opacity="0.28">
    <path d="M0 60 H720"/><path d="M0 160 H720"/><path d="M0 260 H720"/><path d="M0 360 H720"/>
    <path d="M90 0 V460"/><path d="M270 0 V460"/><path d="M450 0 V460"/><path d="M630 0 V460"/>
  </g>

  <g stroke="#0B1F33" stroke-width="2" fill="none">
    <rect x="58" y="76" width="104" height="56"/>
    <rect x="58" y="202" width="104" height="56"/>
    <rect x="58" y="328" width="104" height="56"/>
  </g>
  <g fill="#00468C" opacity="0.9">
    <rect x="58" y="76" width="6" height="56"/>
    <rect x="58" y="202" width="6" height="56"/>
    <rect x="58" y="328" width="6" height="56"/>
  </g>

  <g stroke="#0B1F33" stroke-width="2" fill="none" opacity="0.8">
    <path d="M162 104 C220 104 220 216 288 216"/>
    <path d="M162 230 H288"/>
    <path d="M162 356 C220 356 220 244 288 244"/>
  </g>

  <rect x="288" y="180" width="152" height="100" fill="#F7F5F2" stroke="#0B1F33" stroke-width="2"/>
  <g stroke="#00468C" stroke-width="2">
    <path d="M306 262 V214"/><path d="M330 262 V198"/><path d="M354 262 V226"/>
  </g>

  <path d="M440 230 H556" stroke="#0B1F33" stroke-width="2"/>
  <circle cx="556" cy="230" r="5" fill="#B4400F"/>
  <rect x="556" y="196" width="104" height="68" fill="none" stroke="#0B1F33" stroke-width="1.5"/>
  <path d="M578 230 H638" stroke="#0B1F33" stroke-width="1.5"/>

  <g fill="#0B1F33" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="1.6" opacity="0.85">
    <text x="58" y="60">VENDOR A</text>
    <text x="58" y="186">VENDOR B</text>
    <text x="58" y="312">LEGACY</text>
