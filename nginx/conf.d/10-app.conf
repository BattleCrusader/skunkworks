# demos: the only host that serves /demo/ (C-25). No per-demo server block.
server {
    listen 80; listen 443 ssl;
    server_name demos.skw.test;
    ssl_certificate     /etc/nginx/certs/default.crt;
    ssl_certificate_key /etc/nginx/certs/default.key;

    # The slash-less form FIRST. If the proxying location below is the only one, it
    # matches /demo/<key> with an empty suffix, the rewrite does not fire, and an
    # unstripped path reaches the app, which is forbidden to strip it (C-2) and 404s.
    location ~ "^/demo/(?<demo_key>[a-z0-9][a-z0-9-]{0,39})$" {
        return 301 /demo/$demo_key/$is_args$args;
    }

    location ~ "^/demo/(?<demo_key>[a-z0-9][a-z0-9-]{0,39})(/.*)$" {
        rewrite "^/demo/[a-z0-9][a-z0-9-]{0,39}/(.*)$" /$1 break;
        include /etc/nginx/snippets/skunk-proxy.conf;
        proxy_set_header X-Skunkworks-Tenant $demo_key;
        proxy_set_header X-Forwarded-Prefix "/demo/$demo_key";
        proxy_pass http://app:3000;
    }

    location / { return 404; }
}

# admin: the only host that serves /admin (E-2, §9.1). No /demo/, no /media/.
