# S8r: the two things the edge was not doing, in one file that the stock nginx image can read.
#
# `include /etc/nginx/conf.d/*.conf` sits inside `http {}` in the image's own nginx.conf, which
# ships with `#gzip on;` commented out — so the tenant blocks that the generator writes were
# served with no compression at all, and `curl -H 'accept-encoding: gzip, br'` answered
# `identity` with the full `Content-Length`. Measured on the live box: 12,862 bytes of CSS and
# 6,053 bytes of HTML, both uncompressed.
#
# `http2 on;` cannot live here (it is a server-level directive); the generator emits it per
# block. This file is only about compression.

gzip              on;
gzip_vary         on;
gzip_proxied      any;
# 512 and not 20: compressing a 40-byte answer costs a header and saves nothing.
gzip_min_length   512;
gzip_comp_level   6;
gzip_types        text/plain text/css text/xml application/xml application/json application/javascript text/javascript image/svg+xml;
