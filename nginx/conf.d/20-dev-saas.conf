# 20-dev-saas.conf — local docker dev hostnames for the SSC SaaS products.
#
# HAND-MAINTAINED. Deliberately NOT part of 10-app.conf, which is regenerated by
# tools/nginx_gen.ts from control.db — a regeneration would silently drop these blocks.
#
# These are standalone Astro apps, not skunkworks tenants. They therefore get plain
# reverse-proxy headers and do NOT include snippets/skunk-proxy.conf, which injects the
# X-Skunkworks-Edge token and the fail-closed tenant headers the platform app requires.
#
# Upstreams are the host-published ports, reached via host.docker.internal (Docker Desktop
# resolves it to the host gateway). That keeps both app repos off the skunkworks compose
# network and out of each other's way.
#
#   dev-pinderlog.com      -> host :4323  (pinderlog-app-1,      container :4321)
#   dev-cron-reminder.com  -> host :4322  (cron-reminder app,    container :4321)
#
# Certificates are self-signed, CN/SAN = hostname, 10-year, living in data/certs/
# alongside the existing dev-* pairs. Matching what dev-madetoship.com already does.

server {
    listen 80;
    server_name dev-pinderlog.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev-pinderlog.com;

    ssl_certificate     /etc/nginx/certs/dev-pinderlog.com.crt;
    ssl_certificate_key /etc/nginx/certs/dev-pinderlog.com.key;

    # White-label logo upload posts a file.
    client_max_body_size 8m;

    location / {
        proxy_pass http://host.docker.internal:4323;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

server {
    listen 80;
    server_name dev-cron-reminder.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev-cron-reminder.com;

    ssl_certificate     /etc/nginx/certs/dev-cron-reminder.com.crt;
    ssl_certificate_key /etc/nginx/certs/dev-cron-reminder.com.key;

    client_max_body_size 4m;

    location / {
        proxy_pass http://host.docker.internal:4322;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
