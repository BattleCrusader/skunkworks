# snippets/skunk-proxy.conf — the ONE include inside every proxy_pass location
# (SDS §5.2, register §4.1). install.sh substitutes the edge token into the
# placeholder on the X-Skunkworks-Edge line before nginx starts. The placeholder
# appears exactly once in this file on purpose: a second copy in a comment is a
# trap for a single `replace()`.
#
# The X-Skunkworks-Tenant line is the mechanism that makes a client-supplied
# claim inert on a host-routed location: nginx overwrites whatever the client
# sent with "" before proxying (C-1). X-Forwarded-Prefix is cleared for the same
# reason (E-11): it is the only source of tenant.prefix, so a client value would
# become `/demo/<attacker>/…` on every link the site emits. Path-prefix locations
# override exactly two lines after this include (§5.2).
proxy_http_version 1.1;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Skunkworks-Edge  "__SKW_EDGE_TOKEN__";
proxy_set_header X-Skunkworks-Tenant "";          # fail closed: a client claim never survives
proxy_set_header X-Forwarded-Prefix  "";          # fail closed: a client prefix never survives
# X-Accel-Redirect is deliberately NOT ignored on this include. The adjudication's
# `proxy_ignore_headers X-Accel-Redirect` is for a location proxying to a **non-app**
# upstream, where a compromised sidecar must not be able to mint an offload. Every
# location that includes this file proxies to the app, and §7.4's gated download IS
# that header: ignoring it turns every authorised download into the app's empty 200.
# `test/nginx-gated-e2e.test.ts` G1 fails on exactly that, with a real nginx.
proxy_connect_timeout 2s;
proxy_send_timeout    20s;
proxy_read_timeout    20s;
proxy_next_upstream   off;
