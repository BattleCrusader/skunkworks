# Demo sites for this tenant — hand-maintained, static, no app involvement.
#
# Included by the generated tenant block in 10-app.conf (see tools/nginx_gen.ts,
# `include /etc/nginx/snippets/tenants/<key>/*.conf;`), so it survives regeneration.
#
# Source of truth: skunkworks-sites/demos/<name>/index.html (a self-contained page),
# mounted read-only into this container at /srv/demos. Published URL:
#   https://<this tenant's host>/demos/<name>/
#
# `^~` so no regex location can shadow it, and `alias` (not `root`) because the URI
# prefix /demos/ is not part of the directory name.

location ^~ /demos/ {
    alias /srv/demos/;
    index index.html;
    # A pitch artifact, not a page of this site: keep it out of search and out of caches.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
