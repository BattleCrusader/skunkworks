<section class="hero" data-gjs-type="hero" data-align="left">
  <div class="hero__inner">
    <h1 class="hero__title" data-prop="title">Field notes from a small studio</h1>
    <p class="hero__subtitle" data-prop="subtitle">We build sites that a client can edit without us.</p>
    <img class="hero__image" data-prop="image" data-asset-key="banner/home" alt="The studio">
    <a class="btn btn--primary" data-prop="cta" href="/contact">Talk to us</a>
  </div>
</section>
<div class="list" data-gjs-type="list" data-source="posts" data-limit="3">
  <article class="card" data-repeat>
    <h3 class="card__title" data-bind-title="title">Post title</h3>
    <a class="card__link" data-bind-href-slug="slug" href="/blog/post">Read</a>
  </article>
  <article class="card" data-repeat>
    <h3 class="card__title" data-bind-title="title">Second post</h3>
    <a class="card__link" data-bind-href-slug="slug" href="/blog/second">Read</a>
  </article>
  <p class="list__empty" data-empty>No posts yet.</p>
</div>
<aside class="cta" data-gjs-type="cta">
  <p class="cta__title" data-prop="title">Ready when you are.</p>
  <a class="btn" data-prop="target" href="/contact">Get in touch</a>
</aside>
