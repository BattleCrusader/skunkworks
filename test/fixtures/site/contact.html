<form class="form" data-gjs-type="form" data-form="contact">
  <label class="form__label">Email
    <input class="form__input" name="email" type="email" data-prop="email" placeholder="you@example.com">
  </label>
  <button class="btn" type="submit">Send</button>
</form>
<button class="island island--copy-email" data-gjs-type="copy-email" data-island="copy-email" data-props="{&quot;address&quot;:&quot;hello@example.com&quot;}" type="button" data-prop="address">Copy email</button>
